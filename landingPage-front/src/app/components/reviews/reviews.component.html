<section class="layout__reviews container-responsive">
        <div class="reviews__grid">
          <header class="reviews__header">
            <h4 class="reviews__subtitle">{{ 'REVIEW.SUBTITLE' | translate }}</h4>
            <h2 class="reviews__title">{{ 'REVIEW.TITLE' | translate }}</h2>
          </header>

          <div class="reviews__container">
            <article class="reviews__review">
              <span class="review__company">
                <img
                  src="/img/google-2.png"
                  alt=""
                  class="review__img"
                />
              </span>

              <p class="review__description">
                "{{ 'REVIEW.GOOGLE_TIP' | translate }}"
              </p>
            </article>

            <article class="reviews__review">
              <span class="review__company">
                <img src="/img/udemy.png" alt="" class="review__img" />
              </span>

              <p class="review__description">
                "{{ 'REVIEW.UDEMY_TIP' | translate }}"
              </p>
            </article>

            <article class="reviews__review">
              <span class="review__company">
                <img
                  src="/img/youtube.png "
                  alt=""
                  class="review__img"
                />
              </span>

              <p class="review__description">
                "{{ 'REVIEW.YOUTUBE_TIP' | translate }}"
              </p>
            </article>
          </div>
        </div>

        <ul class="reviews__review-shapes">
          <li class="review-shapes__item review-shapes--shape3">
            <div class="review-shapes__container">
              <img
                src="/img/bubble-1.png"
                alt=""
                class="review-shapes__img"
              />
            </div>
          </li>
        </ul>
      </section>
